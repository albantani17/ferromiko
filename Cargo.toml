[package]
name = "ferromiko"
version = "0.1.0"
edition = "2024"
description = "Netmiko-style SSH/Telnet CLI automation for network devices"
license = "MIT"
repository = "https://github.com/albantani17/ferromiko"
readme = "README.md"

[dependencies]
regex = "1"
russh = { version = "0.65.1", features = ["des", "dsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
thiserror = "2"
textfsm-core = { version = "0.3.1", optional = true }

[features]
# Parse command output with TextFSM templates (netmiko's `use_textfsm`).
textfsm = ["dep:textfsm-core"]
